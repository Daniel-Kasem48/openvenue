name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openvenue
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openvenue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openvenue -d openvenue_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openvenue:test-only-password@localhost:5432/openvenue_test
      TEST_DATABASE_URL: postgresql://openvenue:test-only-password@localhost:5432/openvenue_test
      ADMIN_PASSWORD: integration-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
