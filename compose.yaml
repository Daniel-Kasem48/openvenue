services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openvenue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvenue-local}
      POSTGRES_DB: openvenue
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openvenue -d openvenue']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - '127.0.0.1:3188:3188'
    environment:
      DATABASE_URL: postgresql://openvenue:${POSTGRES_PASSWORD:-openvenue-local}@db:5432/openvenue
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (at least 16 characters)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3188}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3188/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
